name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # publish a model so the services have something to load
      - run: python services/trainer/train.py
      # tests the committed index.html too: its offline copy must still match the fresh model
      - run: pytest -q
      - name: Smoke test the whole stack as separate processes
        run: |
          python scripts/dev.py &
          STACK=$!
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8000/healthz && break; sleep 1; done
          curl -sf http://127.0.0.1:8000/healthz
          curl -sf -X POST http://127.0.0.1:8000/api/predict -H 'content-type: application/json' \
            -d '{"applicant_income":4583,"loan_amount":128,"credit_history":1}'
          kill $STACK; wait $STACK || true
